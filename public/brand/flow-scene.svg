<title id="title">Luxury Performance — P flow pattern</title>
<desc id="desc">Unchanged approved standalone LXP centered within a continuous P-derived flow field. Horizontal lines curve concentrically around the actual P bend centre. Stroke 58 units matches the lettering. P itself is the first curve. Surrounding radii start at 155 units with 88-unit increments and 30-unit clear gaps. The first returning band aligns exactly with the L bottom stroke; this band stops to the right of the unchanged logo, with a 30-unit gap to the logo. Three left-side lines accompany the L: one top line and two lower lines. The lower endpoints follow a concentric 138-unit clearance arc around the L outer radius of 108, maintaining a 30-unit gap. Lines extend beyond every crop edge.</desc>
